name: OpsPS - Configure Production SSO

on:
  workflow_dispatch:
    inputs:
      confirm_setup:
        description: 'Create OpsPS production SSO secrets only (no migration or web deployment)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: opsps-production-sso-setup
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main' && inputs.confirm_setup == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - name: Checkout reviewed setup source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 21db665d9c77cb460840dd15466d9afe7da36c09
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify setup safeguards without credentials
        run: node scripts/test-production-sso-setup.mjs
      - name: Prepare pinned Supabase CLI without credentials
        run: npx --yes supabase@2.81.3 --version
      - name: Save production SSO configuration
        id: setup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'Add SUPABASE_ACCESS_TOKEN to the Production environment secrets, then run this workflow again.'
            exit 1
          fi
          node scripts/configure-production-sso.mjs
      - name: Retain public key receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opsps-production-public-key
          path: opsps-production-public-key.pem
          if-no-files-found: ignore
          retention-days: 7
