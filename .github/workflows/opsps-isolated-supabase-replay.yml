name: OpsPS isolated Supabase replay
on:
  pull_request:
    branches: ['staging/opsps-replay-ci-base']
  push:
    branches: ['staging/production-baseline']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Start isolated disposable Supabase
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opsps-replay"
          cd "$RUNNER_TEMP/opsps-replay"
          supabase init
          supabase start
      - name: Replay all source migrations in order
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=postgres
          count=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)
          test "$count" -eq 30
          while IFS= read -r file; do
            echo "Replay: $file"
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | LC_ALL=C sort)
          psql -X -v ON_ERROR_STOP=1 -f supabase/provisioning/function-hardening.sql
      - name: Assert schema, grants, private storage and tenant sessions
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=postgres
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE t text; f text; r text; p text;
          BEGIN
            FOREACH t IN ARRAY ARRAY['businesses','profiles','business_memberships','trips','products','product_variants','orders','order_items','payments','shipments','inventory_movements','finance_transactions','subscriptions','admin_users','business_payment_profiles','myops_identity_links','myops_app_sessions'] LOOP
              IF to_regclass('public.'||t) IS NULL THEN RAISE EXCEPTION 'Missing table %',t; END IF;
              IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid=to_regclass('public.'||t)) THEN RAISE EXCEPTION 'RLS disabled %',t; END IF;
            END LOOP;
            FOREACH t IN ARRAY ARRAY['myops_identity_links','myops_app_sessions'] LOOP
              FOREACH r IN ARRAY ARRAY['anon','authenticated'] LOOP
                FOREACH p IN ARRAY ARRAY['SELECT','INSERT','UPDATE','DELETE'] LOOP
                  IF has_table_privilege(r,'public.'||t,p) THEN RAISE EXCEPTION 'Private table grant % % %',r,t,p; END IF;
                END LOOP;
              END LOOP;
            END LOOP;
            FOREACH f IN ARRAY ARRAY['bootstrap_founder_business(text,text,text,text,text,text)','opsps_provision_myops_identity(text,uuid)','opsps_provision_myops_identity_v2(text,uuid,text)','opsps_provision_myops_identity_v3(text,uuid,text,text,text)'] LOOP
              IF to_regprocedure('public.'||f) IS NULL THEN RAISE EXCEPTION 'Missing RPC %',f; END IF;
              IF has_function_privilege('anon','public.'||f,'EXECUTE') OR has_function_privilege('authenticated','public.'||f,'EXECUTE') THEN RAISE EXCEPTION 'Browser RPC executable %',f; END IF;
            END LOOP;
            IF NOT has_function_privilege('service_role','public.opsps_provision_myops_identity_v3(text,uuid,text,text,text)','EXECUTE') THEN RAISE EXCEPTION 'Missing service provision grant'; END IF;
            IF EXISTS(SELECT 1 FROM storage.buckets WHERE id IN ('opsps-media','payment-proofs') AND public) OR (SELECT count(*) FROM storage.buckets WHERE id IN ('opsps-media','payment-proofs')) <> 2 THEN RAISE EXCEPTION 'Private buckets missing or public'; END IF;
            IF NOT EXISTS(SELECT 1 FROM pg_policies WHERE schemaname='storage' AND tablename='objects' AND policyname='opsps_myops_session_gate' AND permissive='RESTRICTIVE') OR NOT EXISTS(SELECT 1 FROM pg_policies WHERE schemaname='storage' AND tablename='objects' AND policyname='opsps_media_guard' AND permissive='RESTRICTIVE') THEN RAISE EXCEPTION 'Storage restrictive session guard missing'; END IF;
            IF to_regclass('public.myops_app_sessions_active_user_idx') IS NULL THEN RAISE EXCEPTION 'Active session index missing'; END IF;
            IF NOT EXISTS(SELECT 1 FROM pg_trigger WHERE tgrelid='public.orders'::regclass AND NOT tgisinternal) THEN RAISE EXCEPTION 'Order trigger missing'; END IF;
          END $$;
          BEGIN;
          INSERT INTO auth.users(id) VALUES ('10000000-0000-4000-8000-000000000001'),('10000000-0000-4000-8000-000000000002');
          INSERT INTO public.businesses(id,name) VALUES ('20000000-0000-4000-8000-000000000001','Replay A'),('20000000-0000-4000-8000-000000000002','Replay B');
          INSERT INTO public.business_memberships(business_id,user_id,role) VALUES ('20000000-0000-4000-8000-000000000001','10000000-0000-4000-8000-000000000001','founder'),('20000000-0000-4000-8000-000000000002','10000000-0000-4000-8000-000000000002','founder');
          INSERT INTO public.trips(business_id,name,destination,trip_date) VALUES ('20000000-0000-4000-8000-000000000001','Replay A','Test',current_date),('20000000-0000-4000-8000-000000000002','Replay B','Test',current_date);
          INSERT INTO public.myops_identity_links(myops_user_ref,opsps_user_id) VALUES (repeat('A',43),'10000000-0000-4000-8000-000000000001'),(repeat('B',43),'10000000-0000-4000-8000-000000000002');
          INSERT INTO public.myops_app_sessions(myops_user_ref,opsps_user_id,myops_session_id,supabase_session_id,valid_until) VALUES (repeat('A',43),'10000000-0000-4000-8000-000000000001',gen_random_uuid(),'30000000-0000-4000-8000-000000000001',now()+interval '5 minutes'),(repeat('B',43),'10000000-0000-4000-8000-000000000002',gen_random_uuid(),'30000000-0000-4000-8000-000000000002',now()+interval '5 minutes');
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','10000000-0000-4000-8000-000000000001',true),set_config('request.jwt.claims','{"session_id":"30000000-0000-4000-8000-000000000001"}',true);
          DO $$ BEGIN IF (SELECT count(*) FROM public.trips) <> 1 OR EXISTS(SELECT 1 FROM public.trips WHERE name='Replay B') THEN RAISE EXCEPTION 'A to B tenant isolation failed'; END IF; END $$;
          DO $body$ DECLARE n integer; BEGIN
            BEGIN
              INSERT INTO public.trips(business_id,name,destination,trip_date) VALUES ('20000000-0000-4000-8000-000000000002','Denied A','Test',current_date);
              RAISE EXCEPTION 'A to B INSERT unexpectedly permitted';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
            UPDATE public.trips SET name='Unauthorized' WHERE name='Replay B'; GET DIAGNOSTICS n=ROW_COUNT;
            IF n<>0 THEN RAISE EXCEPTION 'A to B UPDATE permitted'; END IF;
            DELETE FROM public.trips WHERE name='Replay B'; GET DIAGNOSTICS n=ROW_COUNT;
            IF n<>0 THEN RAISE EXCEPTION 'A to B DELETE permitted'; END IF;
          END $body$;
          SELECT set_config('request.jwt.claim.sub','10000000-0000-4000-8000-000000000002',true),set_config('request.jwt.claims','{"session_id":"30000000-0000-4000-8000-000000000002"}',true);
          DO $$ BEGIN IF (SELECT count(*) FROM public.trips) <> 1 OR EXISTS(SELECT 1 FROM public.trips WHERE name='Replay A') THEN RAISE EXCEPTION 'B to A tenant isolation failed'; END IF; END $$;
          DO $body$ DECLARE n integer; BEGIN
            BEGIN
              INSERT INTO public.trips(business_id,name,destination,trip_date) VALUES ('20000000-0000-4000-8000-000000000001','Denied B','Test',current_date);
              RAISE EXCEPTION 'B to A INSERT unexpectedly permitted';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
            UPDATE public.trips SET name='Unauthorized' WHERE name='Replay A'; GET DIAGNOSTICS n=ROW_COUNT;
            IF n<>0 THEN RAISE EXCEPTION 'B to A UPDATE permitted'; END IF;
            DELETE FROM public.trips WHERE name='Replay A'; GET DIAGNOSTICS n=ROW_COUNT;
            IF n<>0 THEN RAISE EXCEPTION 'B to A DELETE permitted'; END IF;
          END $body$;
          SELECT set_config('request.jwt.claims','{"session_id":"30000000-0000-4000-8000-000000000099"}',true);
          DO $$ BEGIN IF EXISTS(SELECT 1 FROM public.trips) THEN RAISE EXCEPTION 'Invalid session allowed'; END IF; END $$;
          RESET ROLE;
          UPDATE public.myops_app_sessions SET revoked_at=now() WHERE opsps_user_id='10000000-0000-4000-8000-000000000002';
          SELECT set_config('request.jwt.claims','{"session_id":"30000000-0000-4000-8000-000000000002"}',true);
          SET LOCAL ROLE authenticated;
          DO $body$ BEGIN IF EXISTS(SELECT 1 FROM public.trips) THEN RAISE EXCEPTION 'Revoked session permitted'; END IF; END $body$;
          RESET ROLE;
          UPDATE public.myops_app_sessions SET revoked_at=NULL, valid_until=now()-interval '1 second' WHERE opsps_user_id='10000000-0000-4000-8000-000000000002';
          SET LOCAL ROLE authenticated;
          DO $body$ BEGIN IF EXISTS(SELECT 1 FROM public.trips) THEN RAISE EXCEPTION 'Expired session permitted'; END IF; END $body$;
          RESET ROLE;
          UPDATE public.myops_app_sessions SET valid_until=now()+interval '5 minutes' WHERE opsps_user_id='10000000-0000-4000-8000-000000000002';
          DELETE FROM public.business_memberships WHERE user_id='10000000-0000-4000-8000-000000000002';
          SET LOCAL ROLE authenticated;
          DO $body$ BEGIN IF EXISTS(SELECT 1 FROM public.trips) THEN RAISE EXCEPTION 'Removed member permitted'; END IF; END $body$;
          RESET ROLE;
          DO $body$ BEGIN IF (SELECT count(*) FROM public.trips)<>2 OR EXISTS(SELECT 1 FROM public.trips WHERE name='Unauthorized') THEN RAISE EXCEPTION 'Unauthorized data changed'; END IF; END $body$;
          ROLLBACK;
          SQL
      - name: Cleanup disposable Supabase
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/opsps-replay"
          supabase stop --no-backup
