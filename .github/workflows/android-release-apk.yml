name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-release-apk.yml'
      - 'android/**'
      - 'app/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'

jobs:
  build-android-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      NODE_VERSION: '20'
      JAVA_VERSION: '17'
      ANDROID_SDK_ROOT: /opt/Android/Sdk
      ANDROID_HOME: /opt/Android/Sdk
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=false
        -Dkotlin.compiler.execution.strategy=in-process
        -Xmx2g
        -XX:MaxMetaspaceSize=512m

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.1.12297006"

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          npm install --legacy-peer-deps

      - name: Expo prebuild (only if Android project is not already generated)
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ]; then
            npx expo prebuild --platform android --clean
          fi

      - name: Write local Gradle SDK path
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build release APK for arm64-v8a only
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a

      - name: Confirm release bundle is packaged in APK
        shell: bash
        run: |
          set -euxo pipefail
          ls -l android/app/build/outputs/apk/release/app-release.apk
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -i 'index.android.bundle'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opsps-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
