name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-release-apk.yml'
      - 'android/**'
      - 'app/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'

jobs:
  build-android-release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" "platforms;android-33"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Android project files
        run: npx expo prebuild --platform android --clean

      - name: Build release APK with bundled JS
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK output
        run: |
          ls -l android/app/build/outputs/apk/release
          echo "APK_PATH=$(pwd)/android/app/build/outputs/apk/release/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opsps-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
