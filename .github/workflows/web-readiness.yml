name: OpsPS web readiness checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/test-opsps-trial.mjs
      - run: npm run test:database
      - run: npm run test:provisioning
      - run: node scripts/test-production-upgrade.mjs
      - run: node scripts/test-production-upgrade.mjs --existing-seller-verification
      - run: node scripts/test-production-sso-setup.mjs
      - run: npm run test:payments
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
