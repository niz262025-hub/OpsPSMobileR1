name: Live Preview E2E

on:
  workflow_dispatch:

jobs:
  playwright-live-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      PLAYWRIGHT_TEST_CUSTOMER_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_CUSTOMER_EMAIL }}
      PLAYWRIGHT_TEST_SELLER_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_SELLER_EMAIL }}
      PLAYWRIGHT_TEST_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_ADMIN_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euxo pipefail
          npx playwright install --with-deps

      - name: Run Playwright live preview checks
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/live-e2e-verify.js
